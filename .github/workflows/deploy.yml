name: Build and Release Swift Wasm

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write  # 允许自动创建/更新 Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Swift 6.4.3 and Wasm SDK
        run: |
          curl -L https://download.swift.org/swiftly/linux/swiftly-x86_64.tar.gz | tar xz
          ./swiftly init --quiet-shell-followup -y
          source "$HOME/.local/share/swiftly/env.sh"
          swiftly install 6.4.3 --use
          curl -fsSL -o /tmp/wasm-sdk.tar.gz https://download.swift.org/swift-6.4.3-release/wasm-sdk/swift-6.4.3-RELEASE/swift-6.4.3-RELEASE_wasm.artifactbundle.tar.gz
          swift sdk install /tmp/wasm-sdk.tar.gz
          rm -f /tmp/wasm-sdk.tar.gz
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build with Vite
        run: |
          swift --version
          npm install
          npm run build

      - name: Package Artifacts
        run: |
          tar -czf frontend-dist.tar.gz -C dist .

      - name: Upload to Rolling Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Frontend Build
          files: frontend-dist.tar.gz
          make_latest: true

      - name: Notify Deployer
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          PAYLOAD='{"action":"published"}'
          SIG="sha256=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')"
          curl -f -X POST http://43.155.204.138:8180/webhook/frontend \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: release" \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$PAYLOAD"